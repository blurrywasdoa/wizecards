<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIZE CARDS - Welcome</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}
  
body{
    background:linear-gradient(145deg,#090711,#171126,#0b0715);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.container{
    width:100%;
    max-width:520px;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:900;
    color:#8b5cff;
    margin-bottom:25px;
}

.logo span{
    color:white;
}

h1{
    font-size:48px;
    background:linear-gradient(90deg,#8b5cff,#19dfff);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:15px;
}

.subtitle{
    color:#aaa6ba;
    font-size:18px;
    margin-bottom:35px;
}

.box{
    border:1px solid #3b3152;
    background:rgba(25,20,35,.7);
    border-radius:25px;
    padding:35px;
    box-shadow:0 0 40px rgba(110,50,255,.15);
}

.lock{
    width:80px;
    height:80px;
    margin:auto auto 30px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#21143d;
    color:#934cff;
    font-size:38px;
}

label{
    display:block;
    text-align:left;
    margin-bottom:10px;
    color:#ddd;
    font-size:17px;
}

input{
    width:100%;
    padding:18px;
    border-radius:15px;
    border:1px solid #49405b;
    background:#272232;
    color:white;
    font-size:18px;
    text-align:center;
    outline:none;
}

button{
    width:100%;
    margin-top:25px;
    padding:19px;
    border:0;
    border-radius:13px;
    background:linear-gradient(90deg,#762df5,#963cff);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px #7938ff;
}

.message{
    margin-top:15px;
    color:#ff7070;
}

footer{
    margin-top:30px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">▣ WIZE<span>CARDS</span></div>

    <h1>Welcome</h1>

    <p class="subtitle">
        Enter your access code to continue
    </p>

    <div class="box">

        <div class="lock">🔒</div>

        <label>Access Code</label>

        <input id="code" type="password" placeholder="Enter code">

        <button onclick="verify()">Verify & Continue</button>

        <div id="message" class="message"></div>

    </div>

    <footer>
        Need access? Contact support
    </footer>

</div>

<script>
/*
   ACCESS CODE
   Change this to whatever code you want.
*/
const ACCESS_CODE = "CP00492";

function verify(){

    const entered = document.getElementById("code").value;

    if(entered === ACCESS_CODE){

        localStorage.setItem("wizeAccess","true");

        window.location.href = "home.html";

    }else{

        document.getElementById("message").textContent =
        "Incorrect access code. Please try again.";

    }
}
</script>

</body>
</html>
